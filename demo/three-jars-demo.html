<title>My零用錢</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Huninn&family=LXGW+WenKai+TC:wght@400;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>/* Single phone-width column, jar trio as the hero, bottom tab bar */
:root{
  /* morandi (default skin) */
  --bg:#ede9e4; --surface:#f8f6f3; --sunk:#e4ded7; --ink:#3e3934; --muted:#7f756d; --line:#d9d1c8;
  --free:#c4a57a; --dream:#c28e8e; --long:#8ea396; --sky:#8c9db0; --accent:#6f857a; --onaccent:#ffffff; --warn:#a9634d;
  --f-display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px;
  /* shape + type tokens (look = 一般) */
  --r-sm:12px; --btn-r:10px; --in-r:10px; --bw:1px; --card-bd:var(--line); --card-sh:none;
  --hw:700; --h-ls:0; --f-num:inherit; --pattern:none;
  color-scheme:light;
}
[data-skin="court"]{--bg:#e8e9ec; --surface:#f6f6f7; --sunk:#dee0e5; --ink:#2e333b; --muted:#6d7480; --line:#d2d6dc;
  --free:#c98a5b; --dream:#7c8db5; --long:#7fa59a; --accent:#56688a; --warn:#ad5f45}
[data-skin="kpop"]{--bg:#eee8ee; --surface:#faf7fa; --sunk:#e6dde7; --ink:#3d3542; --muted:#7f7385; --line:#dcd1de;
  --free:#d29baf; --dream:#a598c9; --long:#92b5b1; --accent:#957aa6; --warn:#ad6370}
[data-skin="earth"]{--bg:#e8e6dc; --surface:#f5f4ee; --sunk:#dedbcf; --ink:#33352b; --muted:#737463; --line:#d3d0c2;
  --free:#bfa373; --dream:#a9806a; --long:#6f8559; --accent:#5f7651; --warn:#a05c3c}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){--bg:#22201e; --surface:#2c2927; --sunk:#252220; --ink:#eee8e2; --muted:#ada39a; --line:#3d3834;
    --free:#d4b88e; --dream:#d3a2a2; --long:#a3b8ab; --sky:#a5b4c4; --accent:#a3b8ab; --onaccent:#1f2420; --warn:#d99a84; color-scheme:dark}
:root:not([data-theme="light"])[data-skin="court"]{--bg:#1c1f25; --surface:#252932; --sunk:#20232a; --ink:#e8eaee; --muted:#a0a7b3; --line:#353a45;
    --free:#de9f70; --dream:#98a8cf; --long:#95bcb0; --accent:#98a8cf; --onaccent:#151821; --warn:#e0937a}
:root:not([data-theme="light"])[data-skin="kpop"]{--bg:#221e25; --surface:#2c2730; --sunk:#251f28; --ink:#f0e9f2; --muted:#b2a6b7; --line:#3e3743;
    --free:#e2b0c2; --dream:#bcafde; --long:#a9cbc6; --accent:#c3a9d2; --onaccent:#231c27; --warn:#e29aa6}
:root:not([data-theme="light"])[data-skin="earth"]{--bg:#1e201a; --surface:#282a22; --sunk:#22241d; --ink:#ecebe2; --muted:#a8a894; --line:#383b30;
    --free:#cdb68a; --dream:#c09a84; --long:#91a87a; --accent:#91a87a; --onaccent:#191b15; --warn:#d29473}
}
:root[data-theme="dark"]{--bg:#22201e; --surface:#2c2927; --sunk:#252220; --ink:#eee8e2; --muted:#ada39a; --line:#3d3834;
    --free:#d4b88e; --dream:#d3a2a2; --long:#a3b8ab; --sky:#a5b4c4; --accent:#a3b8ab; --onaccent:#1f2420; --warn:#d99a84; color-scheme:dark}
:root[data-theme="dark"][data-skin="court"]{--bg:#1c1f25; --surface:#252932; --sunk:#20232a; --ink:#e8eaee; --muted:#a0a7b3; --line:#353a45;
    --free:#de9f70; --dream:#98a8cf; --long:#95bcb0; --accent:#98a8cf; --onaccent:#151821; --warn:#e0937a}
:root[data-theme="dark"][data-skin="kpop"]{--bg:#221e25; --surface:#2c2730; --sunk:#251f28; --ink:#f0e9f2; --muted:#b2a6b7; --line:#3e3743;
    --free:#e2b0c2; --dream:#bcafde; --long:#a9cbc6; --accent:#c3a9d2; --onaccent:#231c27; --warn:#e29aa6}
:root[data-theme="dark"][data-skin="earth"]{--bg:#1e201a; --surface:#282a22; --sunk:#22241d; --ink:#ecebe2; --muted:#a8a894; --line:#383b30;
    --free:#cdb68a; --dream:#c09a84; --long:#91a87a; --accent:#91a87a; --onaccent:#191b15; --warn:#d29473}
.motif{width:22px;height:22px;flex:none;color:var(--accent)}
.skin-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin-pick button{display:grid;gap:8px;text-align:left;padding:12px;border-radius:14px;border:2px solid transparent;cursor:pointer}
.skin-pick button.on{border-color:var(--ink)}
.skin-pick .sw{display:flex;gap:4px}
.skin-pick .sw i{width:22px;height:22px;border-radius:50%;display:block}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{background-image:var(--pattern);background-attachment:fixed}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--hw);letter-spacing:var(--h-ls);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:1.5rem}h2{font-size:1.12rem}h3{font-size:1rem}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--in-r);padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.splash{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.02em}
.logo b{color:var(--free)}.logo i{color:var(--dream);font-style:normal}.logo u{color:var(--accent);text-decoration:none}
.members{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.members::-webkit-scrollbar{display:none}
.mchip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;white-space:nowrap;font-weight:500}
.mchip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff;flex:none}
.av.lg{width:44px;height:44px;font-size:1.1rem}
.av-free{background:var(--free)}.av-dream{background:var(--dream)}.av-long{background:var(--long)}.av-sky{background:var(--sky)}.av-ink{background:var(--muted)}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:12px;border:var(--bw) solid var(--card-bd);box-shadow:var(--card-sh);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}.small{font-size:.86rem}.note{font-size:.8rem;color:var(--muted);line-height:1.5}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.plan{background:color-mix(in srgb,var(--free) 22%,var(--surface))}
.pill.active{background:color-mix(in srgb,var(--long) 22%,var(--surface))}
.pill.closed{background:var(--sunk);color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--btn-r);padding:9px 14px;font-weight:500;text-align:center;text-decoration:none;color:var(--ink);display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:700}
.btn.big{padding:13px 16px;width:100%;font-size:1rem}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.banner{background:var(--sunk);border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem;display:grid;gap:8px}
.banner.warn{border-color:color-mix(in srgb,var(--free) 60%,var(--line));background:color-mix(in srgb,var(--free) 12%,var(--surface))}
/* jars */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:16px 8px 12px;background:var(--surface);border:var(--bw) solid var(--card-bd);box-shadow:var(--card-sh);border-radius:var(--r)}
.jarcol{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.jar{width:min(84px,100%);height:auto}
.jar .fill{transition:y .6s ease}
.jarcol .jn{font-family:var(--f-display);font-weight:700;font-size:.95rem}
.jarcol .ja{font-family:var(--f-num);font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.jarcol .js{font-size:.74rem;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.k-free{color:var(--free)}.k-dream{color:var(--dream)}.k-long{color:var(--long)}
.streak{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.star{color:var(--free);font-size:1rem;letter-spacing:1px}
.star.off{color:var(--line)}
.bar{position:relative;height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>span{position:absolute;top:0;bottom:0;left:0;border-radius:99px;transition:width .5s ease}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.kv b{font-variant-numeric:tabular-nums}
.alloc{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.arow .nm{font-weight:700}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.step{display:flex;align-items:center;gap:6px}
.step button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;line-height:1}
.pct{min-width:44px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.insight{border-radius:var(--r-sm);padding:12px 14px;background:color-mix(in srgb,var(--dream) 12%,var(--surface));font-size:.92rem}
.seg{display:flex;background:var(--sunk);border-radius:var(--btn-r);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:var(--btn-r);padding:8px 6px;font-weight:500;font-size:.9rem}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.85rem}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.li:first-child{border-top:0}
.li .d{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.li .t{min-width:0;overflow-wrap:anywhere}
.tag{font-size:.72rem;border-radius:6px;padding:1px 6px;font-weight:700;white-space:nowrap}
.tag.need{background:color-mix(in srgb,var(--long) 18%,var(--surface))}
.tag.want{background:color-mix(in srgb,var(--free) 25%,var(--surface))}
.tag.shortcut{background:color-mix(in srgb,var(--sky) 20%,var(--surface))}
button.tag{border:0;color:inherit;font-family:inherit;cursor:pointer;line-height:1.5}
.tag.pay-cash{background:color-mix(in srgb,var(--long) 14%,var(--surface))}
.tag.pay-card{background:color-mix(in srgb,var(--dream) 18%,var(--surface))}
.tag.pay-epay{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.tag.pay-transfer{background:color-mix(in srgb,var(--sky) 22%,var(--surface))}
.tag.income{background:color-mix(in srgb,var(--long) 22%,var(--surface))}
.income-form{display:grid;gap:10px}
.tag.pay-none{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:500}
.pay-pick{display:grid;gap:8px}
.pay-pick .chips{margin:0}
.pay-other{flex:1;min-width:0}
.pay-edit{grid-column:1/-1;display:grid;gap:8px;padding:10px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--line) 35%,var(--surface))}
.pay-stats{display:grid;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.ps-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:.9rem}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:2px 6px}
.big-n{font-family:var(--f-num,var(--f-display));font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:10px;fill:var(--muted)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
input[type=range]{padding:0;border:0;accent-color:var(--long);background:transparent}
.empty{text-align:center;padding:18px;color:var(--muted);font-size:.9rem}
.celebrate{border-radius:var(--r-sm);padding:14px;background:color-mix(in srgb,var(--dream) 18%,var(--surface));display:grid;gap:8px}
.sug{display:grid;gap:8px;padding:12px;border-radius:var(--r-sm);background:var(--sunk)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.88rem;z-index:30;max-width:calc(100% - 32px);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;padding:6px 2px;display:grid;justify-items:center;gap:2px;font-size:.76rem;color:var(--muted)}
nav.tabs button.on{color:var(--ink);font-weight:700;background:var(--sunk)}
nav.tabs svg{width:22px;height:22px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .lbl{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.menu{display:grid;background:var(--surface);border:var(--bw) solid var(--card-bd);box-shadow:var(--card-sh);border-radius:var(--r);overflow:hidden}
.menu button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:14px 16px}
.menu button:first-child{border-top:0}
.menu .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700}
.menu small{display:block;color:var(--muted);font-size:.8rem}
.back{border:0;background:transparent;padding:4px 0;color:var(--muted);font-weight:500;justify-self:start}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:.2em;font-weight:700}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;overflow-wrap:anywhere;background:var(--sunk);padding:8px 10px;border-radius:8px}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:8px;font-size:.92rem}
ol.steps li::marker{font-weight:700;color:var(--accent)}
.rule{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.rule .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.92rem}
.sign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sign>div{border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:12px;display:grid;gap:6px;text-align:center;min-height:96px;align-content:center}
.sign .done{border-style:solid;border-color:color-mix(in srgb,var(--long) 50%,var(--line));background:color-mix(in srgb,var(--long) 8%,var(--surface))}
.ev{display:grid;grid-template-columns:minmax(0,1.4fr) 76px minmax(0,1fr) auto;gap:6px;align-items:center}
.months12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.months12 span{aspect-ratio:1;border-radius:6px;background:var(--sunk);display:grid;place-items:center;font-size:.68rem;color:var(--muted)}
.months12 .p{background:color-mix(in srgb,var(--long) 25%,var(--surface));color:var(--ink)}
.months12 .s{background:var(--free);color:#fff}
.login{max-width:440px;margin:0 auto;padding:32px 16px 60px;display:grid;gap:16px}
.hero-j{display:flex;justify-content:center;gap:6px}
.hero-j svg{width:56px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick button{display:grid;justify-items:center;gap:6px;padding:12px 8px;border:var(--bw) solid var(--card-bd);box-shadow:var(--card-sh);border-radius:var(--r-sm);background:var(--surface)}
.pick button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.err{color:var(--warn);font-size:.88rem}
@media (max-width:400px){.ev{grid-template-columns:minmax(0,1fr) 70px;}.ev .evm{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* extra jars (fixed costs, reserve, custom) */
:root{--fixed:#8f9db1;--reserve:#a99a83;--c1:#9fae8c;--c2:#b39aa8;--c3:#8eaaa8;--c4:#b8a582;--c5:#9a96b4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fixed:#a8b6c9;--reserve:#c4b59d;--c1:#b5c4a2;--c2:#cbb2c0;--c3:#a6c2c0;--c4:#d0bd99;--c5:#b2aecb}}
:root[data-theme="dark"]{--fixed:#a8b6c9;--reserve:#c4b59d;--c1:#b5c4a2;--c2:#cbb2c0;--c3:#a6c2c0;--c4:#d0bd99;--c5:#b2aecb}
.trio.more{margin-top:-6px}
.jm-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk)}
.ta{font-family:ui-monospace,Menlo,monospace;font-size:.75rem;min-height:90px}
.amt-in{display:flex;align-items:center;gap:6px}
.amt-in input{width:118px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;padding:8px 10px}

/* ===== looks: 簡約韓系 / 草本日系 / 工業風 / 可愛Q版 (一般 = the defaults above) ===== */
[data-look="korean"]{
  --f-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:22px; --r-sm:16px; --btn-r:999px; --in-r:14px; --bw:0px; --card-bd:transparent;
  --card-sh:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.05); --hw:700; --h-ls:-.01em;
}
[data-look="korean"] .logo{font-weight:700;letter-spacing:-.01em}

/* style picker */
.look-pick{display:grid;gap:10px}
.look-opt{border:2px solid transparent;border-radius:16px;padding:0;background:transparent;text-align:left}
.look-opt.on{border-color:var(--accent)}
.look-opt .lk{background:var(--bg);background-image:var(--pattern);border-radius:14px;padding:12px;display:grid;gap:8px}
.look-opt .lk .card{padding:12px;gap:6px}
.look-opt .lk h3{font-size:1rem}
.look-opt .lk .big-n{font-size:1.3rem}

/* Category donut (月底檢討) — validated categorical order; 其他 folds to neutral gray */
:root{--c-s1:#2a78d6;--c-s2:#eb6834;--c-s3:#1baf7a;--c-s4:#eda100;--c-s5:#e87ba4;--c-s6:#6250d6;--c-other:#a8a49c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-s1:#3987e5;--c-s2:#d95926;--c-s3:#199e70;--c-s4:#c98500;--c-s5:#d55181;--c-s6:#9085e9;--c-other:#77736c}}
:root[data-theme="dark"]{--c-s1:#3987e5;--c-s2:#d95926;--c-s3:#199e70;--c-s4:#c98500;--c-s5:#d55181;--c-s6:#9085e9;--c-other:#77736c}
.pie-wrap{display:grid;gap:12px;justify-items:center}
.pie{width:min(200px,60vw);height:auto}
.pie path{cursor:pointer;stroke:var(--surface);stroke-width:1.5;transition:opacity .15s}
.pie-k{font-size:11px;fill:var(--muted)}
.pie-v{font-size:16px;font-weight:700;fill:var(--ink);font-family:var(--f-num,inherit)}
.pie-legend{display:grid;gap:2px;width:100%}
.pie-legend .pl{display:grid;grid-template-columns:12px 1fr auto 3.2em;gap:8px;align-items:center;padding:6px 8px;border:0;background:transparent;border-radius:var(--r-sm);text-align:left;color:inherit;font:inherit;font-size:.9rem}
.pie-legend .pl.on{background:color-mix(in srgb,var(--line) 45%,transparent)}
.pie-legend .pl i{width:12px;height:12px;border-radius:3px}
.pie-legend .pct{text-align:right;font-size:.8rem}
.nw-pick{display:flex;gap:6px}
.nw-pick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:.8rem;color:inherit}
.nw-pick button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.link-note{border:0;background:transparent;padding:0;color:var(--muted);font:inherit;font-size:.8rem;text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer;text-align:left}

/* Simple (kid) logging */
.quick-log{display:grid;gap:12px}
.ql-amt{font-size:2rem;font-weight:800;text-align:center;padding:12px;font-family:var(--f-num,inherit)}
.ql-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ql-cats button{display:grid;justify-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);color:inherit;font:inherit;font-size:.85rem}
.ql-cats button .ic{font-size:1.6rem;line-height:1}
.ql-cats button.on{border-color:var(--ink);background:color-mix(in srgb,var(--free) 22%,var(--surface));font-weight:700}
.ql-again .chips{margin-top:4px}
/* card bill: tick the swipes already logged */
.card-bill{display:grid;gap:10px}
.cb-list{display:grid;border:1px solid var(--line);border-radius:12px;padding:2px 10px}
.cb-row{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem;cursor:pointer}
.cb-row:first-child{border-top:0}
.cb-row input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.cb-row .d{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.cb-row .t{min-width:0;overflow-wrap:anywhere}
/* stock account */
.stock-list .li{grid-template-columns:1fr auto auto}
.stock-list .li .num{font-weight:700;line-height:1.35}
/* 待確認: bank transfers and deposits from notifications */
.pending{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line))}
.pend-row{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:8px}
.pend-row:first-child{border-top:0}
.pend-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.pend-head .d{color:var(--muted);font-size:.8rem}
.pend-quick{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pend-quick .note{flex:1 1 100%}
/* month calendar */
.seg-sm{min-width:150px}
.seg-sm button{padding:6px 10px;font-size:.85rem}
.cal{padding:12px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-wd{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0 4px}
.cal-cell{min-height:58px;border:1px solid transparent;border-radius:10px;background:var(--sunk);padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;color:inherit;cursor:pointer;min-width:0;overflow:hidden}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today .cal-n{background:var(--ink);color:var(--surface);border-radius:999px;padding:0 6px}
.cal-cell.on{border-color:var(--accent);background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.cal-n{font-size:.85rem;font-weight:700;line-height:1.5}
.cal-out,.cal-in{font-size:.66rem;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
.cal-out{color:var(--warn)}
.cal-in{color:var(--long)}
.cal-dots{display:flex;gap:2px;margin-top:auto}
.cal-dots i,.cal-key{width:6px;height:6px;border-radius:50%;background:var(--sky,var(--accent));display:inline-block}
.cal-dots i.plan,.cal-key.plan{background:transparent;border:1.5px solid var(--warn)}
.cal-dots i.done{background:var(--muted)}
.cal-ev .cal-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cal-up{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}
.check input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.legend i.cal-key{width:8px;height:8px;border-radius:50%;background:var(--sky)}
.legend i.cal-key.plan{background:transparent;border:1.5px solid var(--warn)}

/* ---------- 記一筆 sheet, category icons, day list (v2) ---------- */
.cat-ic{display:inline-grid;place-items:center;border-radius:50%;flex:none;line-height:1;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--ink,#000) 5%,transparent)}
.cat-ic img{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
.cat-cell:active .cat-ic img,.cat-cell.on .cat-ic img{transform:scale(1.12) rotate(-6deg);transition:transform .15s}
.fab-row{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:10px;align-items:center}
.fab{border:0;border-radius:999px;
  padding:13px 26px;background:var(--accent);color:var(--onaccent,#fff);font:inherit;font-weight:800;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.fab span{font-size:1.15rem;margin-right:2px}
.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-bg{position:absolute;inset:0;border:0;background:rgba(0,0,0,.35);cursor:default}
.sheet{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:94dvh;display:flex;flex-direction:column;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2);width:100%;max-width:560px;margin:0 auto;animation:sheetUp .22s ease}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;justify-content:center;position:relative;padding:4px 0 8px}
.sheet-top .x{position:absolute;right:4px;top:2px}
.sheet-tabs{display:flex;gap:8px}
.sheet-tabs button{border:0;border-radius:999px;padding:7px 18px;font:inherit;font-weight:700;background:var(--sunk);color:var(--muted);cursor:pointer}
.sheet-tabs button.on{background:var(--accent);color:var(--onaccent,#fff)}
.sheet-body{overflow:auto;min-height:0;flex:1 1 auto;display:grid;gap:10px;align-content:start;padding:2px 2px 8px}
.cat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 4px}
.cat-cell{display:grid;justify-items:center;gap:3px;padding:6px 2px;border:1.5px solid transparent;border-radius:14px;background:none;font:inherit;font-size:.74rem;color:var(--ink);cursor:pointer;min-width:0}
.cat-cell span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cat-cell.on{border-color:var(--accent);background:var(--surface)}
.sheet-chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;scrollbar-width:none}
.schip{position:relative;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:inherit;font-size:.82rem;font-weight:700;color:var(--ink);cursor:pointer}
.schip.on{border-color:var(--accent)}
.schip input[type=date]{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.schip select{border:0;background:none;font:inherit;color:inherit;padding:0;appearance:none;-webkit-appearance:none;cursor:pointer}
.sheet-note input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;color:var(--ink)}
.sheet-amt{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px}
.sheet-amt b{font-size:1.6rem}
.sheet-amt b.out{color:var(--warn)}
.sheet-amt b.in{color:var(--long)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.keypad button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font:inherit;font-size:1.2rem;font-weight:600;color:var(--ink);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.keypad button.op{background:var(--sunk);font-size:1rem}
.keypad button:active{transform:scale(.97)}
.keypad button.done{background:var(--accent);color:var(--onaccent,#fff);font-weight:800;font-size:1rem;display:grid;line-height:1.15;-webkit-touch-callout:none}
.keypad button.done small{font-size:.62rem;font-weight:600;opacity:.85}
.keypad button.done:disabled{opacity:.45}
.month-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.month-sum>div{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;background:var(--sunk);border-radius:14px;padding:10px 12px}
.month-sum .b{grid-row:span 2}
.month-sum b.num{font-size:1.05rem}
i.b,span.b{display:inline-grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:800;border-radius:6px;width:20px;height:20px;color:#fff;margin-right:3px}
.b.out{background:var(--warn)}
.b.in{background:var(--long)}
.daylist{display:grid;gap:14px}
.day-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.9rem;padding:0 2px 6px}
.day-sum{display:inline-flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums}
.day-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.swr{position:relative;border-top:1px solid var(--line);overflow:hidden}
.swr:first-child{border-top:0}
.sw-acts{position:absolute;left:0;top:0;bottom:0;display:flex}
.sw-copy{background:var(--c-s4)}
.sw-acts button{flex:1;border:0;color:#fff;font:inherit;font-weight:800;font-size:.85rem;cursor:pointer;line-height:1.2}
.sw-edit{background:var(--accent)}
.sw-del{background:var(--warn)}
.sw-row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;background:var(--surface);touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none}
.rec-t{display:grid;gap:2px;min-width:0}
.rec-t b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-s{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-tags{display:flex;gap:4px;flex-wrap:wrap}
.rec-a{font-size:1rem;font-weight:800}
.rec-a.in{color:var(--long)}
main.stack{padding-bottom:80px}
.bar.thin{height:6px}
.bud-list{display:grid;gap:10px}
.bud-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.bud-mid{display:grid;gap:3px;min-width:0}
.bud-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bud-cell{display:grid;justify-items:center;gap:4px;padding:8px 6px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:.8rem}
.bud-cell input{width:100%;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 4px;font:inherit;background:var(--bg);color:var(--ink)}
.cal-cell.st{cursor:default}
.nw-card{text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.acc-row{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}

.acc-ic{width:36px;height:36px;border-radius:30%;display:grid;place-items:center;background:var(--sunk);font-size:1.1rem}

:root[data-theme="dark"][data-skin="latte"]{--bg:#221e1a; --surface:#2c2722; --sunk:#25211d; --ink:#efe8e0; --muted:#b1a597; --line:#3f3831; --free:#d6b083; --dream:#c9a197; --long:#a3b394; --accent:#c99e7d; --onaccent:#211912; --warn:#d99178}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.icon-pick button{display:grid;justify-items:center;gap:4px;padding:8px 4px;border:2px solid transparent;border-radius:14px;background:var(--sunk);font:inherit;font-size:.75rem;color:var(--ink);cursor:pointer}
.icon-pick button.on{border-color:var(--accent);background:var(--surface)}
.icon-pick img{border-radius:22%}
.fab.mic{padding:0;width:50px;height:50px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:1.3rem}
.voice-btn{display:flex;align-items:center;gap:12px;justify-content:center;border:2px dashed var(--line);border-radius:18px;padding:16px;background:var(--surface);font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.voice-btn .mic{font-size:1.8rem}
.voice-btn.on{border-color:var(--warn);border-style:solid;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--warn) 18%,transparent)}}
.voice-text{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:inherit;color:var(--ink);resize:vertical}
.voice-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.voice-row:first-child{border-top:0}
.voice-row.off{opacity:.4}
.voice-row.off b{text-decoration:line-through}

/* grown-ups' jars page */
.jars-sum{gap:8px}
.jar-rows{display:grid;margin-top:6px;border-top:1px solid var(--line)}
.jar-row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;width:100%}
.jar-row:last-child{border-bottom:0}
button.jar-row{cursor:pointer}
.jar-row .t{display:grid;gap:1px;min-width:0}
.jar-row .t b{font-family:var(--f-display);font-size:.98rem}
.jar-row .num{font-size:1.02rem}
.jar-mini{width:40px;height:50px;display:block}
.jar-mini .jar{width:100%;height:100%}
.jar-row .link{color:var(--dream);font-weight:700}
.card-h.fold{width:100%;border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.schip .caret{font-size:.7rem;color:var(--muted)}
.jar-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jar-pick button{display:grid;gap:2px;text-align:left;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font:inherit;color:var(--ink);cursor:pointer}
.jar-pick button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}

/* 小財怪投資成長紀錄 — cream, navy and gold; Taiwan colours for gains (red) and losses (green) */
.xc{--xc-navy:#1f2a44;--xc-navy2:#2c3b5e;--xc-gold:#c9a24a;--xc-gold-hi:#f2cf74;--xc-up:#d14b45;--xc-down:#2e9468;--xc-up-hi:#ff8f86;--xc-down-hi:#7fd7aa;display:grid;gap:14px}
.xc-hero{position:relative;overflow:hidden;border-radius:var(--r);padding:18px 16px 14px;color:#f7efdc;background:radial-gradient(120% 90% at 100% 0%,#3a4d7a 0%,var(--xc-navy) 55%,#151d31 100%);display:grid;grid-template-columns:84px 1fr;gap:4px 14px;align-items:center;box-shadow:0 8px 24px rgba(20,28,48,.25)}
.xc-hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(242,207,116,.05) 0 2px,transparent 2px 14px);pointer-events:none}
.xc-monster{width:84px;height:84px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@media (prefers-reduced-motion:no-preference){.xc-monster{animation:xcbob 3s ease-in-out infinite}}
@keyframes xcbob{50%{transform:translateY(-4px) rotate(-2deg)}}
.xc-cap{font-family:var(--f-display);font-weight:800;letter-spacing:.06em;color:var(--xc-gold-hi);font-size:.92rem}
.xc-label{font-size:.78rem;opacity:.75;margin-top:4px}
.xc-big{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.xc-stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(242,207,116,.25)}
.xc-stats div{display:grid;gap:1px;min-width:0}
.xc-stats span{font-size:.72rem;opacity:.7}
.xc-stats b{font-variant-numeric:tabular-nums;font-size:1rem}
.xc-stats small{font-size:.68rem;opacity:.6}
.xc .btn.xc-add{background:linear-gradient(180deg,#d9b35a,var(--xc-gold));color:#2a1f05;border-color:transparent}
.xc-tag{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--xc-gold) 18%,var(--surface));color:color-mix(in srgb,var(--xc-gold) 60%,var(--ink));margin-left:6px;vertical-align:1px}
.xc-tag.solid{color:#fff;margin:0}
.xc-styles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.xc-style{display:grid;gap:3px;justify-items:start;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:inherit;color:inherit;cursor:pointer;text-align:left}
.xc-style .xc-tag{margin:0}
.xc-style.on{border-color:var(--xc-gold)}
.xc-style b{white-space:nowrap;font-size:1.02rem}
.xc-style small{font-size:.7rem;color:var(--muted)}
.xc-group{display:grid}
.xc-month{font-size:.78rem;font-weight:700;color:var(--muted);padding:10px 0 4px;border-bottom:1px solid var(--line)}
.xc-row{border-bottom:1px solid var(--line)}
.xc-row.open{background:color-mix(in srgb,var(--xc-gold) 6%,transparent)}
.xc-row-main{width:100%;display:grid;grid-template-columns:34px 24px 1fr auto;gap:8px;align-items:start;padding:10px 2px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.xc-date{font-size:.78rem;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.xc-side{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:.75rem;font-weight:800;color:#fff}
.xc-side.buy{background:var(--xc-up)}.xc-side.sell{background:var(--xc-down)}
.xc-mid{display:grid;gap:2px;min-width:0}
.xc-name{overflow:hidden;text-overflow:ellipsis}
.xc-reason{font-size:.8rem;color:var(--ink);opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.xc-plan{display:flex;flex-wrap:wrap;gap:4px}
.xc-plan span{font-size:.7rem;padding:0 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.xc-right{display:grid;justify-items:end;gap:1px;white-space:nowrap}
.xc-right small{font-size:.72rem;font-weight:700}
.xc-edit{display:grid;gap:10px;padding:4px 2px 14px}
.xc-note{display:grid;gap:8px}
.xc-note textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);color:var(--ink);resize:vertical}
.xc-alerts{display:grid;gap:14px}
.xc-alert{display:grid;gap:6px}
.xc-bar{position:relative;height:34px}
.xc-track{position:absolute;left:0;right:0;top:8px;height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--xc-down) 35%,var(--surface)),var(--line) 45%,color-mix(in srgb,var(--xc-up) 35%,var(--surface)))}
.xc-mk{position:absolute;top:16px;transform:translateX(-50%);font-size:.66rem;font-weight:700;white-space:nowrap}
.xc-mk i{position:absolute;left:50%;top:-10px;width:2px;height:8px;background:currentColor;transform:translateX(-50%)}
.xc-mk.dim{color:var(--muted)}
.xc-now{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;background:var(--xc-navy);border:3px solid var(--xc-gold-hi);transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.hold-list{display:grid;border-top:1px solid var(--line)}
.hold-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hold-row:last-child{border-bottom:0}
.hold-row .t{display:grid;min-width:0}
.hold-row .r{display:grid;justify-items:end;white-space:nowrap}
.hold-row .r small{font-size:.72rem;font-weight:700}
.btn.xc-link{display:flex;justify-content:space-between;width:100%;background:linear-gradient(180deg,#24314f,#1f2a44);color:#f2cf74;border-color:transparent;font-weight:800}
.xc-acct{margin-bottom:-4px}

body{padding-top:0}
</style>
